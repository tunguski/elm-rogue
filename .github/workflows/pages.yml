name: Deploy to GitHub Pages

# Compiles the roguelike to a single self-contained HTML page and publishes it to
# https://tunguski.github.io/elm-rogue/.
#
# The game is written for the elm-lang compiler (github.com/tunguski/elm-lang), which lives in a
# separate repo, so the build checks that out, packages it into a runnable `elm.jar`, and runs
# `elm make` to produce the page. Like the other elm-lang example apps it compiles with --no-check
# (the strict type checker doesn't fully analyse a few idioms the game uses). The output is fully
# standalone — no server needed.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Least-privilege token plus the permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Check out the elm-lang compiler
        uses: actions/checkout@v4
        with:
          repository: tunguski/elm-lang
          ref: master
          path: elm-lang

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          cache-dependency-path: elm-lang/pom.xml

      - name: Build the elm compiler (elm.jar)
        working-directory: elm-lang
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean package -DskipTests

      - name: Compile the game to public/index.html
        run: |
          mkdir -p public
          java -jar elm-lang/target/elm.jar make \
            src/Main.elm --project=elm.json -o public/index.html --no-check
          # The compiler owns the output <head>; inject a viewport meta (so phones use the responsive
          # layout / touch controls) and inline src/app.css as a <style> (the app's styling lives there
          # as classes; the page stays a single self-contained file).
          CSSFILE=src/app.css perl -0pi -e '
            s#<meta charset="utf-8">#<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">#;
            open(my $f, "<", $ENV{CSSFILE}) or die "no app.css: $!";
            local $/; my $css = <$f>; close($f);
            s#</head>#"<style id=\"rg-app-css\">".$css."</style></head>"#e;
          ' public/index.html
          ls -la public

      # Stamp the short commit hash + UTC build time into a tiny fixed-position badge, so anyone can
      # glance at the live page and confirm which commit is deployed and when it was built. The badge
      # is appended to <html> (not <body>) by a small script, so it survives Elm taking over the body.
      # NOTE: perl uses -0777 (slurp the whole file as one record), NOT -0: the compiled HTML contains
      # a NUL byte, and -0 treats NUL as the record separator — which would split the file and inject
      # the badge twice (once mid-runtime, corrupting it).
      - name: Stamp commit hash + build time into the footer
        run: |
          SHA=$(git rev-parse --short HEAD)
          WHEN=$(date -u '+%Y-%m-%d %H:%M UTC')
          export STAMP="built $WHEN · $SHA"
          echo "Stamping: $STAMP"
          find public -name '*.html' -print0 | xargs -0 -r perl -0777 -pi -e '
            my $t = $ENV{STAMP};
            my $s = "<script>(function(){function a(){"
                  . "if(document.getElementById(\"build-stamp\"))return;"
                  . "var d=document.createElement(\"div\");d.id=\"build-stamp\";d.textContent=\"$t\";"
                  . "d.title=\"deployed build\";"
                  . "d.style.cssText=\"position:fixed;bottom:4px;right:6px;z-index:2147483647;"
                  . "font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:rgba(150,165,190,.72);"
                  . "background:rgba(8,12,18,.55);padding:2px 7px;border-radius:6px;pointer-events:none;"
                  . "letter-spacing:.02em\";(document.documentElement||document.body).appendChild(d);}"
                  . "if(document.readyState!=\"loading\")a();"
                  . "else document.addEventListener(\"DOMContentLoaded\",a);})();<\/script>";
            if    (s#</body>#$s</body>#) {}
            elsif (s#</html>#$s</html>#) {}
            else  { $_ .= $s }
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
